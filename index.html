<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUNARIS Terminal (Bitget Edition)</title>
    <meta name="description" content="Cross-asset AI agentic trading terminal bridging crypto and equities with autonomous execution, multi-agent debate council, social pulse radar, and deterministic risk veto engine." />
    <meta property="og:title" content="LUNARIS Terminal (Bitget Edition)" />
    <meta property="og:description" content="Cross-asset AI agentic trading terminal bridging crypto and equities with autonomous execution, multi-agent debate council, social pulse radar, and deterministic risk veto engine." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      /* Zero-millisecond instant preloader */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050508;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }
      #lunaris-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #050508;
        background-image: 
          radial-gradient(circle at 50% 35%, rgba(0, 240, 255, 0.09) 0%, transparent 55%),
          radial-gradient(circle at 80% 80%, rgba(250, 204, 21, 0.05) 0%, transparent 50%);
        z-index: 99999;
        user-select: none;
      }
      .preloader-crest {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
      }
      .crest-ring {
        position: absolute;
        inset: -6px;
        border-radius: 18px;
        border: 1.5px solid transparent;
        border-top-color: #00F0FF;
        border-right-color: #FACC15;
        animation: crestSpin 2s linear infinite;
      }
      .crest-glow {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.28) 0%, transparent 70%);
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .crest-icon {
        position: relative;
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #00F0FF 0%, #FACC15 50%, #D946EF 100%);
        border-radius: 10px;
        transform: rotate(45deg);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      }
      .crest-icon-inner {
        width: 18px;
        height: 18px;
        background: #050508;
        border-radius: 50%;
        transform: rotate(-45deg);
      }
      .preloader-title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #ffffff;
        margin: 0 0 5px 0;
        font-family: 'JetBrains Mono', monospace, sans-serif;
      }
      .preloader-sub {
        font-size: 9.5px;
        color: #a1a1aa;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 22px;
        font-family: 'JetBrains Mono', monospace, sans-serif;
      }
      .preloader-bar-wrap {
        width: 250px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .preloader-bar-fill {
        height: 100%;
        width: 15%;
        background: linear-gradient(90deg, #00F0FF, #FACC15, #00F0FF);
        background-size: 200% 100%;
        border-radius: 999px;
        animation: fillProgress 3s cubic-bezier(0.1, 0.5, 0.2, 1) forwards, gradientShift 1.5s linear infinite;
      }
      .preloader-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 250px;
        margin-top: 10px;
        font-family: 'JetBrains Mono', monospace, sans-serif;
        font-size: 10px;
        color: #71717a;
      }
      .preloader-status {
        color: #38bdf8;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preloader-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #00F0FF;
        box-shadow: 0 0 8px #00F0FF;
        animation: blink 1s infinite alternate;
      }
      .preloader-log {
        margin-top: 16px;
        font-family: 'JetBrains Mono', monospace, sans-serif;
        font-size: 9.5px;
        color: #71717a;
        letter-spacing: 0.05em;
        height: 16px;
      }
      @keyframes crestSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes fillProgress {
        0% { width: 8%; }
        25% { width: 38%; }
        55% { width: 72%; }
        85% { width: 92%; }
        100% { width: 99%; }
      }
      @keyframes blink {
        0% { opacity: 0.3; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="lunaris-preloader">
        <div class="preloader-crest">
          <div class="crest-glow"></div>
          <div class="crest-ring"></div>
          <div class="crest-icon">
            <div class="crest-icon-inner"></div>
          </div>
        </div>
        <div class="preloader-title">LUNARIS TERMINAL</div>
        <div class="preloader-sub">BITGET QUANT ENGINE // COCKPIT BOOT</div>
        <div class="preloader-bar-wrap">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-meta">
          <span class="preloader-status">
            <span class="preloader-dot"></span>
            INITIALIZING
          </span>
          <span id="preloader-pct">15%</span>
        </div>
        <div id="preloader-log" class="preloader-log">[01/04] CONNECTING BITGET L2 STREAM...</div>
      </div>
      <script>
        (function() {
          var pctEl = document.getElementById('preloader-pct');
          var logEl = document.getElementById('preloader-log');
          if (!pctEl || !logEl) return;
          var logs = [
            '[01/04] CONNECTING BITGET L2 STREAM...',
            '[02/04] INITIALIZING AI COUNCIL AGENTS...',
            '[03/04] CALIBRATING RISK VETO FIREWALL...',
            '[04/04] HYDRATING QUANT TRADING ENGINE...'
          ];
          var pct = 15;
          var step = 0;
          var timer = setInterval(function() {
            pct = Math.min(99, pct + Math.floor(Math.random() * 8) + 4);
            pctEl.textContent = pct + '%';
            if (pct > 32 && step < 1) { step = 1; logEl.textContent = logs[1]; }
            else if (pct > 64 && step < 2) { step = 2; logEl.textContent = logs[2]; }
            else if (pct > 86 && step < 3) { step = 3; logEl.textContent = logs[3]; }
            if (pct >= 99) clearInterval(timer);
          }, 160);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
